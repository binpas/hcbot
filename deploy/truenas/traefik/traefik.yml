# Traefik static settings. Copy to /mnt/POOL/apps/traefik/traefik.yml.
# See README.md, "Web interface". The Cloudflare token is in .env, not here.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le
        domains:
          - main: "*.example.com"

providers:
  file:
    filename: /data/dynamic.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  level: INFO
