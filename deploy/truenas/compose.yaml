# HEALTH bot as a TrueNAS SCALE custom app (Apps > Discover Apps >
# Install via YAML). See README.md, "Run on TrueNAS".
#
# Change these before you install:
#   - the app and container name (one for each instance, for example hcbot
#     or hcbot-test)
#   - the host folder: a dataset that holds .env, hcbot.db, markov.db,
#     backups/ and the cookies file. It must belong to UID and GID 568
#     (apps), mode 0700.
#
# Do not put BOT_TOKEN or other secrets in this file. TrueNAS keeps the
# app YAML in its config. The bot reads them from /data/.env.
#
# Do not run the same bot token in two places at the same time.

services:
  hcbot:
    image: ghcr.io/binpas/hcbot:latest
    container_name: hcbot
    restart: unless-stopped
    stop_grace_period: 30s
    user: "568:568"
    working_dir: /data
    volumes:
      - /mnt/POOL/apps/hcbot:/data
    environment:
      TZ: UTC
    # For /say: the text to speech worker (tts-compose.yaml) is on the host,
    # at TTS_URL=http://host.docker.internal:8765. Use the docker0 IPv4
    # address (ip -4 addr show docker0), the same as in tts-compose.yaml:
    # with IPv6 on, host-gateway gives an IPv6 address, and the worker port
    # is open only on IPv4.
    extra_hosts:
      - "host.docker.internal:172.16.0.1"
    # The bot only makes outbound connections. With METRICS_ADDR=:9101 in
    # .env, it serves Prometheus metrics: publish the port on the host's
    # LAN address only (README.md, "Metrics").
    # ports:
    #   - "192.168.1.10:9101:9101"
    read_only: true
    tmpfs:
      # /download keeps its files and the yt-dlp cache here.
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
